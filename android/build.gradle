import groovy.xml.XmlSlurper
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        def androidExtension = subproject.extensions.findByName("android")
        if (androidExtension == null || !androidExtension.hasProperty("namespace")) {
            return
        }

        def namespaceValue = androidExtension.namespace
        if (namespaceValue != null && namespaceValue.toString().trim()) {
            return
        }

        def manifestFile = new File(subproject.projectDir, "src/main/AndroidManifest.xml")
        if (!manifestFile.exists()) {
            return
        }

        def manifest = new XmlSlurper(false, false).parse(manifestFile)
        def manifestPackage = manifest.@package?.text()
        if (manifestPackage != null && manifestPackage.trim()) {
            androidExtension.namespace = manifestPackage
        }
    }
}

subprojects { subproject ->
    if (subproject.name != "image_gallery_saver") {
        return
    }

    def forceImageGallerySaverSdk = {
        def androidExtension = subproject.extensions.findByName("android")
        if (androidExtension == null) {
            return
        }

        // image_gallery_saver 2.0.3 pins compileSdkVersion 30, which causes
        // android:attr/lStar link failures on newer AndroidX dependencies.
        if (androidExtension.hasProperty("compileSdk")) {
            androidExtension.compileSdk = 34
        } else {
            androidExtension.compileSdkVersion 34
        }
    }

    subproject.plugins.withId("com.android.library") {
        forceImageGallerySaverSdk.call()

        def androidComponents = subproject.extensions.findByName("androidComponents")
        if (androidComponents != null) {
            androidComponents.finalizeDsl { _ ->
                forceImageGallerySaverSdk.call()
            }
        }

        def androidExtension = subproject.extensions.findByName("android")

        if (androidExtension != null && androidExtension.hasProperty("compileOptions")) {
            androidExtension.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }

    subproject.tasks.withType(KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
